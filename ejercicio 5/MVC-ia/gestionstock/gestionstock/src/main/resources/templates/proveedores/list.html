<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores | gestionstock</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('proveedores')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-truck"></i></span>
              <div>
                <p class="eyebrow mb-1">Compras</p>
                <h1 class="h3 mb-1">Proveedores</h1>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-primary btn-sm" th:href="@{/proveedores/nuevo}">
                <i class="bi bi-plus-lg"></i> Agregar proveedor
              </a>
            </div>
          </div>

          <div class="panel">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Razon Social</th>
                    <th scope="col">CUIT</th>
                    <th scope="col">Rubro</th>
                    <th scope="col" class="text-end">Opciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="proveedor : ${proveedores}">
                    <td th:text="${proveedor.razonSocial}">Razon Social</td>
                    <td th:text="${proveedor.cuit}">CUIT</td>
                    <td th:text="${proveedor.rubro}">Rubro</td>
                    <td class="text-end">
                      <a class="btn btn-outline-secondary btn-sm" th:href="@{/proveedores/editar/{id}(id=${proveedor.idProveedor})}">
                        <i class="bi bi-pencil"></i> Editar
                      </a>
                      <form th:action="@{/proveedores/eliminar/{id}(id=${proveedor.idProveedor})}" method="post" class="d-inline">
                        <button class="btn btn-outline-danger btn-sm" type="submit"
                                onclick="return confirm('Dar de baja este proveedor?');">
                          <i class="bi bi-trash"></i>
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(proveedores)}">
                    <td colspan="4" class="text-center text-muted py-4">Todavia no hay proveedores cargados.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
