<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | gestionstock</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('productos')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-box-seam"></i></span>
              <div>
                <p class="eyebrow mb-1">Inventario</p>
                <h1 class="h3 mb-1">Productos</h1>
                <p class="text-muted mb-0">Listado real proveniente de MySQL (cada fila es un ProductoDTO armado por ProductoService a partir de la entidad Producto).</p>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-primary btn-sm" th:href="@{/productos/nuevo}">
                <i class="bi bi-plus-lg"></i> Agregar producto
              </a>
            </div>
          </div>

          <div class="panel">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Codigo</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Categoria</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Stock</th>
                    <th scope="col" class="text-end">Opciones</th>
                  </tr>
                </thead>
                <tbody>
                  <!--
                      "productos" es un List<ProductoDTO> agregado al Model
                      por ProductoController.listar(). Ninguna entidad JPA
                      llega hasta esta vista.
                  -->
                  <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}">1</td>
                    <td th:text="${producto.nombre}">Nombre</td>
                    <td th:text="${producto.categoria}">Categoria</td>
                    <td th:text="${'$' + producto.precio}">$0</td>
                    <td>
                      <span class="badge" th:classappend="${producto.stockActual > 0} ? 'text-bg-success' : 'text-bg-danger'"
                            th:text="${producto.stockActual}">0</span>
                    </td>
                    <td class="text-end">
                      <a class="btn btn-outline-secondary btn-sm" th:href="@{/productos/editar/{id}(id=${producto.id})}">
                        <i class="bi bi-pencil"></i> Editar
                      </a>
                      <form th:action="@{/productos/eliminar/{id}(id=${producto.id})}" method="post" class="d-inline">
                        <button class="btn btn-outline-danger btn-sm" type="submit"
                                onclick="return confirm('Dar de baja este producto?');">
                          <i class="bi bi-trash"></i>
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="6" class="text-center text-muted py-4">Todavia no hay productos cargados.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
