<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion | gestionstock</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/public.css}">
</head>
<body class="auth-body">
  <main>
    <section class="auth-card mx-auto">
      <div class="text-center mb-4">
        <img th:src="@{/images/main-logo.png}" alt="Logo" style="max-height:48px;">
      </div>

      <form th:action="@{/login}" method="post">
        <h1 class="h4 mb-1">Acceso de empleados</h1>
        <p class="text-muted mb-4">Ingresa con tu correo y contrasena.</p>

        <div class="alert alert-danger" th:if="${error != null}" th:text="${error}"></div>

        <div class="mb-3">
          <label class="form-label" for="correo">Correo</label>
          <input class="form-control" id="correo" name="correo" type="email" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Contrasena</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>

        <button class="btn btn-brand w-100" type="submit">
          <i class="bi bi-box-arrow-in-right"></i> Ingresar
        </button>
      </form>

      <div class="text-center mt-4">
        <a th:href="@{/}" class="text-muted small"><i class="bi bi-arrow-left"></i> Volver a la pagina principal</a>
      </div>
    </section>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
