<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${modoEdicion} ? 'Editar producto' : 'Agregar producto'">Producto</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('productos')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-box-seam"></i></span>
              <div>
                <p class="eyebrow mb-1">Inventario</p>
                <h1 class="h3 mb-1" th:text="${modoEdicion} ? 'Editar producto' : 'Agregar producto'">Producto</h1>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-outline-secondary btn-sm" th:href="@{/productos}"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
          </div>

          <section class="row g-3">
            <div class="col-12 col-xl-8">
              <!--
                  th:object="${productoDTO}" vincula el formulario con el
                  ProductoDTO que ProductoController agrego al Model
                  (nuevo en el alta, o precargado con
                  ProductoService.buscarPorId(id) en la edicion). Cada
                  th:field="*{atributo}" hace data-binding contra el DTO,
                  NUNCA contra la entidad Producto: cuando el formulario
                  se envia, Spring reconstruye un ProductoDTO (no un
                  Producto) para pasarselo al Controller.
              -->
              <form class="panel" method="post" th:object="${productoDTO}"
                    th:action="${modoEdicion} ? @{/productos/editar/{id}(id=${productoDTO.id})} : @{/productos}">
                <div class="panel-header">
                  <h2 class="h5 mb-1 section-title"><i class="bi bi-pencil-square"></i><span>Datos del producto</span></h2>
                </div>

                <!-- Errores de Bean Validation (@NotBlank, @NotNull, etc. del DTO) -->
                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                  <div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre del producto</label>
                    <input class="form-control" id="nombre" th:field="*{nombre}" type="text" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="categoria">Categoria</label>
                    <input class="form-control" id="categoria" th:field="*{categoria}" type="text">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="marca">Marca</label>
                    <input class="form-control" id="marca" th:field="*{marca}" type="text">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="precio">Precio</label>
                    <input class="form-control" id="precio" th:field="*{precio}" type="number" step="0.01" min="0" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="descripcion">Descripcion</label>
                    <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="2"></textarea>
                  </div>
                  <!-- El stock solo se carga en el alta; en edicion se modifica unicamente via Ordenes de compra. -->
                  <div class="col-md-6" th:unless="${modoEdicion}">
                    <label class="form-label" for="stockInicial">Stock inicial</label>
                    <input class="form-control" id="stockInicial" th:field="*{stockInicial}" type="number" min="0">
                  </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                  <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Guardar</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
