<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda | gestionstock</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/public.css}">
</head>
<body class="public-body">

  <!--
      VIEW (capa View de MVC). Esta pagina es de solo lectura: no tiene
      formularios ni botones de alta/edicion/baja, a diferencia de las
      vistas del "Vista de Empleado". Reutiliza ProductoService.listarActivos()
      (el mismo Service que usa el AMB de productos) a traves de
      PublicController, mostrando datos REALES de MySQL, tal como exige
      el punto 8 del enunciado para cualquier listado del sistema.
  -->
  <nav class="navbar navbar-expand-lg public-navbar py-3">
    <div class="container">
      <a class="navbar-brand" th:href="@{/}">
        <img th:src="@{/images/main-logo.png}" class="brand-logo" alt="Logo">
      </a>
      <div class="ms-auto">
        <a class="btn btn-outline-dark btn-sm" th:href="@{/login}">
          <i class="bi bi-person"></i> Iniciar sesion
        </a>
      </div>
    </div>
  </nav>

  <header class="hero-banner text-center">
    <div class="container">
      <h1 class="display-6 mb-2">Productos de tecnologia</h1>
      <p class="text-muted">Catalogo actualizado directamente desde nuestro sistema de inventario.</p>
    </div>
  </header>

  <main class="container py-5">
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-lg-4" th:each="producto : ${productos}">
        <div class="producto-card p-3">
          <div class="producto-img-placeholder mb-3 rounded">
            <i class="bi bi-image"></i>
          </div>
          <h2 class="h6 mb-1" th:text="${producto.nombre}">Nombre</h2>
          <p class="text-muted small mb-2" th:text="${producto.categoria}">Categoria</p>
          <p class="fw-semibold mb-0" th:text="${'$' + producto.precio}">$0</p>
        </div>
      </div>
      <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(productos)}">
        Todavia no hay productos cargados en el catalogo.
      </div>
    </div>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
