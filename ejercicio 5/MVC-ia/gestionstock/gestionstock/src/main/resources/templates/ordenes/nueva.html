<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realizar compra | gestionstock</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('ordenes-nueva')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-cart-plus"></i></span>
              <div>
                <p class="eyebrow mb-1">Compras</p>
                <h1 class="h3 mb-1">Realizar compra</h1>
                <p class="text-muted mb-0">Elegi el proveedor y cargá cantidad + precio unitario de cada producto a reponer.</p>
              </div>
            </div>
          </div>

          <!--
              Un unico formulario envia, por cada producto de la tabla,
              tres campos con el MISMO name ("productoId", "cantidad",
              "precioUnitario"): Spring los recibe como listas paralelas
              en OrdenCompraController.registrar(...), que las combina en
              un NuevaOrdenDTO antes de llamar al Service (ver comentario
              en ese Controller).
          -->
          <form class="panel" th:action="@{/ordenes}" method="post">
            <div class="mb-3 col-md-6">
              <label class="form-label" for="idProveedor">Proveedor</label>
              <select class="form-select" id="idProveedor" name="idProveedor" required>
                <option value="" disabled selected>Seleccionar proveedor</option>
                <option th:each="proveedor : ${proveedores}"
                        th:value="${proveedor.idProveedor}"
                        th:text="${proveedor.razonSocial}">Proveedor</option>
              </select>
            </div>

            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Producto</th>
                    <th scope="col">Stock actual</th>
                    <th scope="col" style="width: 140px;">Cantidad a reponer</th>
                    <th scope="col" style="width: 160px;">Precio unitario</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="producto : ${productos}">
                    <td>
                      <input type="hidden" name="productoId" th:value="${producto.id}">
                      <span th:text="${producto.nombre}">Nombre</span>
                    </td>
                    <td th:text="${producto.stockActual}">0</td>
                    <td><input class="form-control" type="number" name="cantidad" min="0" value="0"></td>
                    <td><input class="form-control" type="number" name="precioUnitario" min="0" step="0.01" value="0"></td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay productos cargados todavia.</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="d-flex justify-content-end mt-4" th:if="${not #lists.isEmpty(productos)}">
              <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Confirmar orden de compra</button>
            </div>
          </form>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
