<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva compra | sistemacompras</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('compra-nueva')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-cart-plus"></i></span>
              <div>
                <p class="eyebrow mb-1">Compras</p>
                <h1 class="h3 mb-1">Nueva compra</h1>
                <p class="text-muted mb-0">Indica la cantidad de cada producto que queres comprar (dejar en 0 los que no aplican).</p>
              </div>
            </div>
          </div>

          <!--
              Un unico <form> envia, para cada producto listado, dos campos
              con el MISMO name ("productoId" y "cantidad"): Spring los
              recibe como List<Long>/List<Integer> en
              CompraController.registrarCompra(...), respetando el orden
              de aparicion en el HTML (por eso se combinan por indice en
              el Controller).
          -->
          <form class="panel" th:action="@{/compras}" method="post">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Producto</th>
                    <th scope="col">Precio</th>
                    <th scope="col" style="width: 160px;">Cantidad</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="producto : ${productos}">
                    <td>
                      <input type="hidden" name="productoId" th:value="${producto.id}">
                      <span th:text="${producto.nombre}">Nombre</span>
                    </td>
                    <td th:text="${'$' + producto.precio}">$0</td>
                    <td>
                      <input class="form-control" type="number" name="cantidad" min="0" value="0">
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="3" class="text-center text-muted py-4">No hay productos cargados todavia.</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="d-flex justify-content-end mt-4" th:if="${not #lists.isEmpty(productos)}">
              <button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i> Confirmar compra</button>
            </div>
          </form>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
