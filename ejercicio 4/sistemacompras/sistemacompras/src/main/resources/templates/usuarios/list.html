<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios | sistemacompras</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('usuarios')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-people"></i></span>
              <div>
                <p class="eyebrow mb-1">Administracion</p>
                <h1 class="h3 mb-1">Usuarios</h1>
                <p class="text-muted mb-0">Cuentas registradas y su estado de acceso (ACTIVO/BLOQUEADO).</p>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Correo</th>
                    <th scope="col">Intentos fallidos</th>
                    <th scope="col">Estado</th>
                    <th scope="col" class="text-end">Accion</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.nombreCompleto}">Nombre</td>
                    <td th:text="${usuario.correo}">correo@ejemplo.com</td>
                    <td th:text="${usuario.intentosFallidos}">0</td>
                    <td>
                      <span class="badge" th:classappend="${usuario.estado.name() == 'ACTIVO'} ? 'text-bg-success' : 'text-bg-danger'"
                            th:text="${usuario.estado}">ACTIVO</span>
                    </td>
                    <td class="text-end">
                      <!--
                          Este boton solo tiene sentido cuando la cuenta
                          esta BLOQUEADA. th:if evita mostrar una accion
                          que no aplica, en lugar de dejarla deshabilitada.
                      -->
                      <form th:if="${usuario.estado.name() == 'BLOQUEADO'}"
                            th:action="@{/usuarios/desbloquear/{id}(id=${usuario.id})}" method="post" class="d-inline">
                        <button class="btn btn-outline-success btn-sm" type="submit">
                          <i class="bi bi-unlock"></i> Desbloquear
                        </button>
                      </form>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" class="text-center text-muted py-4">Todavia no hay usuarios registrados.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
