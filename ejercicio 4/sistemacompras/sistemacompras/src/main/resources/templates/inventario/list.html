<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | sistemacompras</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('inventario')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-clipboard-data"></i></span>
              <div>
                <p class="eyebrow mb-1">Administracion</p>
                <h1 class="h3 mb-1">Inventario</h1>
                <p class="text-muted mb-0">Historial de movimientos de stock (positivo = entrada, negativo = salida por venta).</p>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="table-responsive">
              <table class="table align-middle mb-0">
                <thead>
                  <tr>
                    <th scope="col">Fecha</th>
                    <th scope="col">Producto</th>
                    <th scope="col">Tipo</th>
                    <th scope="col" class="text-end">Cantidad</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="mov : ${movimientos}">
                    <td th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                    <td th:text="${mov.producto.nombre}">Producto</td>
                    <td th:text="${mov.tipoMovimiento}">Tipo</td>
                    <td class="text-end">
                      <span class="badge" th:classappend="${mov.cantidad >= 0} ? 'text-bg-success' : 'text-bg-danger'"
                            th:text="${mov.cantidad}">0</span>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(movimientos)}">
                    <td colspan="4" class="text-center text-muted py-4">No hay movimientos registrados todavia.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
