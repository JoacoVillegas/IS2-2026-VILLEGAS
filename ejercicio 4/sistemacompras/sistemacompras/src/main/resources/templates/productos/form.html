<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${modoEdicion} ? 'Editar producto' : 'Nuevo producto'">Producto</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="admin-shell">
    <div th:replace="~{fragments/layout :: sidebar('productos')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-box-seam"></i></span>
              <div>
                <p class="eyebrow mb-1">Catalogo</p>
                <h1 class="h3 mb-1" th:text="${modoEdicion} ? 'Editar producto' : 'Nuevo producto'">Producto</h1>
              </div>
            </div>
            <div class="heading-actions">
              <a class="btn btn-outline-secondary btn-sm" th:href="@{/productos}"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
          </div>

          <section class="row g-3">
            <div class="col-12 col-xl-8">
              <!--
                  El action del formulario cambia segun si estamos creando
                  (POST /productos) o editando (POST /productos/editar/{id}).
                  Notese que la accion "actualizar en cascada el stock"
                  NO ocurre desde aca: el stock se maneja unicamente a
                  traves de Inventario, respetando la agregacion del
                  diagrama de clases.
              -->
              <form class="panel" method="post"
                    th:action="${modoEdicion} ? @{/productos/editar/{id}(id=${producto.id})} : @{/productos}">
                <div class="panel-header">
                  <h2 class="h5 mb-1 section-title"><i class="bi bi-pencil-square"></i><span>Datos del producto</span></h2>
                </div>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" for="nombre">Nombre</label>
                    <input class="form-control" id="nombre" name="nombre" type="text" th:value="${producto.nombre}" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label" for="precio">Precio</label>
                    <input class="form-control" id="precio" name="precio" type="number" step="0.01" min="0" th:value="${producto.precio}" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label" for="descripcion">Descripcion</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3" th:text="${producto.descripcion}"></textarea>
                  </div>
                  <!-- El stock inicial solo tiene sentido al crear el producto:
                       una vez creado, el stock se ajusta exclusivamente
                       mediante movimientos de Inventario (compras, altas manuales). -->
                  <div class="col-md-6" th:unless="${modoEdicion}">
                    <label class="form-label" for="stockInicial">Stock inicial</label>
                    <input class="form-control" id="stockInicial" name="stockInicial" type="number" min="0" value="0">
                  </div>
                </div>
                <div class="d-flex justify-content-end gap-2 mt-4">
                  <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                  <button class="btn btn-primary" type="submit">
                    <i class="bi bi-check-lg"></i> Guardar
                  </button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
