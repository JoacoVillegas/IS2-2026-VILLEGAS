<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | sistemacompras</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/vendors/bootstrap-icons/bootstrap-icons.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div class="admin-shell">

    <!-- th:replace inserta aca el contenido del fragmento "sidebar" definido
         en fragments/layout.html, pasandole 'dashboard' como parametro
         "activo" para resaltar el item de menu correspondiente. -->
    <div th:replace="~{fragments/layout :: sidebar('dashboard')}"></div>

    <div class="admin-main">
      <div th:replace="~{fragments/layout :: topbar}"></div>

      <main class="dashboard-content">
        <div class="container-fluid px-3 px-lg-4 py-4">
          <div class="page-heading">
            <div class="page-heading-copy">
              <span class="page-icon"><i class="bi bi-speedometer2"></i></span>
              <div>
                <p class="eyebrow mb-1">Bienvenido</p>
                <h1 class="h3 mb-1" th:text="${nombreSesion}">Nombre</h1>
                <p class="text-muted mb-0" th:text="${esAdmin} ? 'Panel de administracion' : 'Panel de cliente'">Rol</p>
              </div>
            </div>
          </div>

          <section class="row g-3">
            <div class="col-12 col-md-6 col-xl-3">
              <a class="panel text-decoration-none text-body d-block h-100" th:href="@{/productos}">
                <h2 class="h5 mb-1 section-title"><i class="bi bi-box-seam"></i><span>Productos</span></h2>
                <p class="text-muted mb-0">Ver catalogo y stock disponible.</p>
              </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3" th:if="${esAdmin}">
              <a class="panel text-decoration-none text-body d-block h-100" th:href="@{/usuarios}">
                <h2 class="h5 mb-1 section-title"><i class="bi bi-people"></i><span>Usuarios</span></h2>
                <p class="text-muted mb-0">Ver cuentas y desbloquear accesos.</p>
              </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3" th:if="${esAdmin}">
              <a class="panel text-decoration-none text-body d-block h-100" th:href="@{/inventario}">
                <h2 class="h5 mb-1 section-title"><i class="bi bi-clipboard-data"></i><span>Inventario</span></h2>
                <p class="text-muted mb-0">Historial de movimientos de stock.</p>
              </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3" th:unless="${esAdmin}">
              <a class="panel text-decoration-none text-body d-block h-100" th:href="@{/compras/nueva}">
                <h2 class="h5 mb-1 section-title"><i class="bi bi-cart-plus"></i><span>Nueva compra</span></h2>
                <p class="text-muted mb-0">Elegir productos y confirmar una compra.</p>
              </a>
            </div>

            <div class="col-12 col-md-6 col-xl-3" th:unless="${esAdmin}">
              <a class="panel text-decoration-none text-body d-block h-100" th:href="@{/compras}">
                <h2 class="h5 mb-1 section-title"><i class="bi bi-receipt"></i><span>Mis compras</span></h2>
                <p class="text-muted mb-0">Ver historial de compras realizadas.</p>
              </a>
            </div>
          </section>
        </div>
      </main>

      <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
  </div>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
