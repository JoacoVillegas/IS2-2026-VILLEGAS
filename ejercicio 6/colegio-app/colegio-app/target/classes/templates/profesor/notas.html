<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: documentHead('Notas')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div id="layoutSidenav">
    <div id="layoutSidenav_nav" th:replace="~{fragments/layout :: sidebar-profesor}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Notas</h1>
                <ol class="breadcrumb mb-4"><li class="breadcrumb-item active">Notas</li></ol>
                <div th:replace="~{fragments/layout :: alertas}"></div>

                <div class="card mb-4">
                    <div class="card-header">Cargar nueva nota</div>
                    <div class="card-body">
                        <form th:action="@{/profesor/notas/nueva}" th:object="${notaDTO}" method="post" class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label">Alumno</label>
                                <select class="form-select" th:field="*{alumnoId}">
                                    <option th:each="a : ${alumnosDisponibles}" th:value="${a.id}" th:text="${a.nombre} + ' ' + ${a.apellido}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Materia</label>
                                <select class="form-select" th:field="*{materiaId}">
                                    <option th:each="m : ${materiasDisponibles}" th:value="${m.idMateria}" th:text="${m.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Fecha</label>
                                <input type="date" class="form-control" th:field="*{fecha}" />
                            </div>
                            <div class="col-md-2">
                                <label class="form-label">Valor (0 a 10)</label>
                                <input type="number" step="0.01" min="0" max="10" class="form-control" th:field="*{valor}" />
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-primary w-100" type="submit">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">Notas cargadas (cursos a mi cargo)</div>
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead><tr><th>Alumno</th><th>Materia</th><th>Fecha</th><th>Nota</th></tr></thead>
                            <tbody>
                                <tr th:each="n : ${notas}">
                                    <td th:text="${n.alumnoNombreCompleto}"></td>
                                    <td th:text="${n.materiaNombre}"></td>
                                    <td th:text="${n.fecha}"></td>
                                    <td th:text="${n.valor}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(notas)}"><td colspan="4" class="text-center text-muted">Todavia no hay notas cargadas.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
