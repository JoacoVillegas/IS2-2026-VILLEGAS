<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: documentHead('Mis materias')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div id="layoutSidenav">
    <div id="layoutSidenav_nav" th:replace="~{fragments/layout :: sidebar-profesor}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Mis materias</h1>
                <ol class="breadcrumb mb-4"><li class="breadcrumb-item active">Mis materias</li></ol>
                <div class="card mb-4">
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead><tr><th>Materia</th><th>Curso</th><th>Año lectivo</th></tr></thead>
                            <tbody>
                                <tr th:each="d : ${asignaciones}">
                                    <td th:text="${d.materia.nombre}"></td>
                                    <td th:text="${d.aula.grado.nivel} + ' - ' + ${d.aula.division}"></td>
                                    <td th:text="${d.anioLectivo}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(asignaciones)}"><td colspan="3" class="text-center text-muted">Aun no tenes materias asignadas.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
