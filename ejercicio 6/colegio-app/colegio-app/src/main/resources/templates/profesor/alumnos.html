<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: documentHead('Mis alumnos')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div id="layoutSidenav">
    <div id="layoutSidenav_nav" th:replace="~{fragments/layout :: sidebar-profesor}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Mis alumnos</h1>
                <ol class="breadcrumb mb-4"><li class="breadcrumb-item active">Mis alumnos</li></ol>
                <div class="card mb-4">
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead><tr><th>Nombre</th><th>Apellido</th><th>Curso</th></tr></thead>
                            <tbody>
                                <tr th:each="a : ${alumnos}">
                                    <td th:text="${a.nombre}"></td>
                                    <td th:text="${a.apellido}"></td>
                                    <td th:text="${a.aulaDescripcion}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(alumnos)}"><td colspan="3" class="text-center text-muted">No hay alumnos en tus cursos asignados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
