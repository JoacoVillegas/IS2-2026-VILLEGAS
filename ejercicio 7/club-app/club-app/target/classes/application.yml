server:
  port: 8080

spring:
  application:
    name: club-app

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:club_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:2003}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        envers:
          audit_table_suffix: _AUD
          revision_field_name: REV
          revision_type_field_name: REVTYPE

  thymeleaf:
    cache: false
    encoding: UTF-8

  # Tamaño maximo de imagen que se puede subir para el rostro del Socio/Persona
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  sql:
    init:
      mode: always

logging:
  level:
    org.hibernate.envers: DEBUG
    com.example.club: DEBUG
