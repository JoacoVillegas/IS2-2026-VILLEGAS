<!DOCTYPE html>
<!--
    Fragmentos Thymeleaf reutilizables, adaptados de la plantilla Bootstrap
    "SB Admin" provista. th:fragment permite definir un trozo de HTML aqui
    y reutilizarlo en cualquier vista con
    th:replace="~{fragments/layout :: nombreFragmento}".

    IMPORTANTE (leccion aprendida en el proyecto de colegio): el fragmento
    de cabecera se llama "documentHead" y NO "head", para no colisionar con
    la etiqueta HTML literal <head> -- si tuvieran el mismo nombre,
    Thymeleaf puede resolver el selector de fragmento contra la etiqueta
    <head> real (sin parametros) en lugar del th:block parametrizado,
    produciendo el error "specifies synthetic (unnamed) parameters, but the
    resolved fragment does not match a fragment signature". Por eso este
    archivo NO tiene una etiqueta <head></head> vacia.
-->
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<th:block th:fragment="documentHead(titulo)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title th:text="${titulo} + ' - Club App'">Club App</title>
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/club.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</th:block>

<!-- ============ NAVBAR SUPERIOR ============ -->
<nav th:fragment="navbar" class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
    <a class="navbar-brand ps-3" th:href="@{/dashboard}">Club Deportivo</a>
    <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
    <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
        <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="fas fa-user fa-fw"></i>
                <span sec:authentication="name">usuario</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                <li><a class="dropdown-item" th:href="@{/cambiar-password}">Cambiar contraseña</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button class="dropdown-item" type="submit">Cerrar sesion</button>
                    </form>
                </li>
            </ul>
        </li>
    </ul>
</nav>

<!-- ============ SIDEBAR DEL ADMIN ============ -->
<nav th:fragment="sidebar-admin" class="sb-sidenav accordion sb-sidenav-dark club-sidebar" id="sidenavAccordion">
    <div class="sb-sidenav-menu">
        <div class="nav">
            <div class="sb-sidenav-menu-heading">Panel de Administracion</div>
            <a class="nav-link" th:href="@{/admin/dashboard}"><div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>Dashboard</a>
            <a class="nav-link" th:href="@{/admin/socios}"><div class="sb-nav-link-icon"><i class="fas fa-id-badge"></i></div>Socios</a>
            <a class="nav-link" th:href="@{/admin/familias}"><div class="sb-nav-link-icon"><i class="fas fa-users"></i></div>Familias</a>
            <a class="nav-link" th:href="@{/admin/personas}"><div class="sb-nav-link-icon"><i class="fas fa-user"></i></div>Personas</a>
            <a class="nav-link" th:href="@{/admin/actividades}"><div class="sb-nav-link-icon"><i class="fas fa-running"></i></div>Actividades</a>
            <a class="nav-link" th:href="@{/admin/pagos}"><div class="sb-nav-link-icon"><i class="fas fa-money-bill-wave"></i></div>Pagos</a>
            <a class="nav-link" th:href="@{/acceso/dashboard}"><div class="sb-nav-link-icon"><i class="fas fa-door-open"></i></div>Accesos</a>
        </div>
    </div>
    <div class="sb-sidenav-footer">
        <div class="small">Conectado como:</div>
        <span sec:authentication="name">admin</span>
    </div>
</nav>

<!-- ============ SIDEBAR DE RECEPCION ============ -->
<nav th:fragment="sidebar-recepcion" class="sb-sidenav accordion sb-sidenav-dark club-sidebar" id="sidenavAccordion">
    <div class="sb-sidenav-menu">
        <div class="nav">
            <div class="sb-sidenav-menu-heading">Recepcion</div>
            <a class="nav-link" th:href="@{/acceso/dashboard}"><div class="sb-nav-link-icon"><i class="fas fa-door-open"></i></div>Registrar accesos</a>
        </div>
    </div>
    <div class="sb-sidenav-footer">
        <div class="small">Conectado como:</div>
        <span sec:authentication="name">recepcion</span>
    </div>
</nav>

<!-- ============ FOOTER ============ -->
<footer th:fragment="footer" class="py-4 bg-light mt-auto">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">Sistema de Gestion de Club Deportivo &copy; 2026</div>
        </div>
    </div>
</footer>

<!-- ============ SCRIPTS COMUNES ============ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="/js/scripts.js"></script>
</th:block>

<!-- ============ ALERTAS ============ -->
<div th:fragment="alertas">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

</body>
</html>
