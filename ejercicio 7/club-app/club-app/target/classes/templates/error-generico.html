<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Ocurrio un error</title>
    <link href="/css/styles.css" rel="stylesheet" />
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm mt-5">
                <div class="card-body text-center">
                    <h3 class="text-danger">Ocurrio un problema</h3>
                    <!-- Mensaje amigable (ver GlobalExceptionHandler.java); nunca se muestra el stack trace tecnico. -->
                    <p th:text="${mensajeError}">Detalle del error</p>
                    <a class="btn btn-primary" th:href="@{/dashboard}">Volver</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
