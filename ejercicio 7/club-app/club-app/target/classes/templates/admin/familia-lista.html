<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: documentHead('Familias')}"></head>
<body class="sb-nav-fixed">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div id="layoutSidenav">
    <div id="layoutSidenav_nav" th:replace="~{fragments/layout :: sidebar-admin}"></div>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">Familias</h1>
                <div th:replace="~{fragments/layout :: alertas}"></div>
                <p class="text-muted">Cada familia se crea automaticamente al registrar un Socio (el socio es su titular).</p>
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                <tr>
                                    <th>Titular</th>
                                    <th>Integrantes</th>
                                    <th>Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="familia : ${familias}">
                                    <td th:text="${familia.socioTitularNombreCompleto}"></td>
                                    <td th:text="${#lists.size(familia.familiares)}"></td>
                                    <td><a class="btn btn-sm btn-secondary" th:href="@{/admin/familias/{id}(id=${familia.id})}">Ver detalle</a></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
