<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Ingresar - Club App</title>
    <link href="/css/styles.css" rel="stylesheet" />
    <link href="/css/club.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>
<body class="bg-primary">
<div id="layoutAuthentication">
    <div id="layoutAuthentication_content">
        <main>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5">
                        <div class="card shadow-lg border-0 rounded-lg mt-5">
                            <div class="card-header"><h3 class="text-center font-weight-light my-4">Club Deportivo</h3></div>
                            <div class="card-body">
                                <!-- th:action genera el token CSRF automaticamente (thymeleaf-extras-springsecurity6). -->
                                <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos.</div>
                                <div th:if="${param.logout}" class="alert alert-success">Sesion cerrada correctamente.</div>
                                <form th:action="@{/login}" method="post">
                                    <div class="form-floating mb-3">
                                        <input class="form-control" name="email" type="email" placeholder="nombre@club.com" required autofocus />
                                        <label>Correo electronico</label>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input class="form-control" name="password" type="password" placeholder="Contraseña" required />
                                        <label>Contraseña</label>
                                    </div>
                                    <div class="d-flex align-items-center justify-content-end mt-4 mb-0">
                                        <button class="btn btn-primary" type="submit">Ingresar</button>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer text-center py-3">
                                <div class="small text-muted">Usuarios de prueba: admin@club.com / recepcion@club.com (ver README.md)</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer class="py-4 bg-light mt-auto">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center justify-content-center small text-muted">Sistema de Gestion de Club Deportivo &copy; 2026</div>
        </div>
    </footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/scripts.js"></script>
</body>
</html>
