spring.application.name=product-app

# ************************* MySQL Database Configuration ******************************
# spring.jpa.database=mysql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=2003
spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/productdbEj5?createDatabaseIfNotExist=true&serverTimezone=UTC

spring.jpa.hibernate.ddl-auto=update
# Ensure Spring Boot runs the schema and data SQL files at startup

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
# This ensures that data.sql is executed during startup

spring.jpa.show-sql=true

server.port=8080